[package]
name = "oly-truepic-harness-rs-emu"
version = "0.1.0"
edition = "2024"
description = "oly-truepic-harness: MN10300 mnemonic-level CPU interpreter + PageMem memory in Rust (PyO3 module _rs_emu); optional accelerator for ofh/emu/pyemu.py"
license = "Apache-2.0"
publish = false

[lib]
name = "_rs_emu"
crate-type = ["cdylib", "rlib"]

[features]
# build.py builds with --features extension-module (the cdylib that Python imports);
# `cargo test` builds without it so the unit tests link against libpython.
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.27" }
rustc-hash = "2.1.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = false
overflow-checks = true
